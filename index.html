<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Lira Ledger">
<link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon.svg">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Lira Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column; cobalt "today" card on top, budget rows below, tab bar fixed at the bottom. İznik cobalt + turquoise. */
:root {
  --bg: #EDF1F7;
  --surface: #FFFFFF;
  --ink: #0F1B33;
  --muted: #56667F;
  --line: #D6DDE9;
  --track: #E2E8F2;
  --accent: #1F4FD1;
  --accent-2: #0E9E9A;
  --hero-bg: #1A3EA6;
  --hero-ink: #FFFFFF;
  --hero-muted: #BFD0FF;
  --good: #13855A;
  --warn: #A86D12;
  --bad: #C2362F;
  --good-bg: #E1F4EB;
  --warn-bg: #FBF0DC;
  --bad-bg: #FCE6E4;
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A111F; --surface: #121B2D; --ink: #E5ECF8; --muted: #94A3BD; --line: #233049; --track: #1C2740;
    --accent: #7FA3FF; --accent-2: #3CCFC9; --hero-bg: #1A2C5E; --hero-ink: #EEF3FF; --hero-muted: #A9BCF0;
    --good: #52C891; --warn: #E9B25E; --bad: #FF7D73; --good-bg: #12301F; --warn-bg: #33270F; --bad-bg: #3A1716;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A111F; --surface: #121B2D; --ink: #E5ECF8; --muted: #94A3BD; --line: #233049; --track: #1C2740;
  --accent: #7FA3FF; --accent-2: #3CCFC9; --hero-bg: #1A2C5E; --hero-ink: #EEF3FF; --hero-muted: #A9BCF0;
  --good: #52C891; --warn: #E9B25E; --bad: #FF7D73; --good-bg: #12301F; --warn-bg: #33270F; --bad-bg: #3A1716;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.app { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.num { font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
.brand span { color: var(--accent-2); }
.month { display: flex; align-items: center; gap: 4px; }
.month b { min-width: 9.5em; text-align: center; font-weight: 700; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 18px; line-height: 1; }

.hero { background: var(--hero-bg); color: var(--hero-ink); border-radius: 20px; padding: 18px 18px 16px; display: grid; gap: 12px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; font-weight: 700; color: var(--hero-muted); }
.big { font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 11vw, 48px); line-height: 1.05; letter-spacing: -0.02em; }
.big.neg { color: #FFB4AE; }
.hero-sub { color: var(--hero-muted); font-size: 14px; }
.hero-meter { height: 8px; border-radius: 99px; background: rgba(255,255,255,0.18); overflow: hidden; }
.hero-meter i { display: block; height: 100%; background: var(--hero-ink); border-radius: 99px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; border-top: 1px solid rgba(255,255,255,0.18); padding-top: 12px; }
.stats div { display: grid; gap: 2px; min-width: 0; }
.stats small { font-size: 11px; color: var(--hero-muted); }
.stats strong { font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card h2 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.card h2 em { font-style: normal; text-transform: none; letter-spacing: 0; color: var(--ink); }

.insights { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.insights li { display: grid; grid-template-columns: 8px 1fr; gap: 10px; align-items: start; padding: 10px 12px; border-radius: 10px; background: var(--track); }
.insights li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; background: var(--muted); }
.insights li.bad { background: var(--bad-bg); } .insights li.bad::before { background: var(--bad); }
.insights li.warn { background: var(--warn-bg); } .insights li.warn::before { background: var(--warn); }
.insights li.good { background: var(--good-bg); } .insights li.good::before { background: var(--good); }

.cats { display: grid; gap: 14px; }
.cat { display: grid; gap: 6px; }
.cat-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.cat-name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.cat-type { font-size: 11px; color: var(--muted); margin-left: 6px; font-weight: 500; }
.cat-left { font-weight: 700; white-space: nowrap; }
.cat-foot { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); }
.bar { height: 8px; border-radius: 99px; background: var(--track); overflow: hidden; position: relative; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.bar.good i { background: var(--good); } .bar.warn i { background: var(--warn); } .bar.bad i { background: var(--bad); } .bar.neutral i { background: var(--accent-2); }
.bar .pace { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: 0.45; }
.pill { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.pill.good { color: var(--good); background: var(--good-bg); } .pill.warn { color: var(--warn); background: var(--warn-bg); } .pill.bad { color: var(--bad); background: var(--bad-bg); } .pill.neutral { color: var(--muted); background: var(--track); }

.chart svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: var(--accent); }
.legend span.l2::before { background: var(--bad); } .legend span.l3::before { height: 2px; vertical-align: 3px; background: var(--muted); }

form, .form { display: grid; gap: 12px; }
label { display: grid; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); }
input[type=number], input[type=text], input[type=date], select { width: 100%; min-width: 0; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 16px; }
.amount-input { font-family: var(--font-display); font-size: 26px !important; font-weight: 700; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { display: flex; align-items: center; gap: 10px; font-weight: 500; color: var(--ink); font-size: 14px; }
.check input { width: 20px; height: 20px; accent-color: var(--bad); }
.btn { border: 0; border-radius: 12px; padding: 13px 16px; font-weight: 700; background: var(--accent); color: var(--surface); }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
.btn.small { padding: 8px 12px; font-size: 13px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }

.list { list-style: none; margin: 0; padding: 0; display: grid; }
.list li { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.list li:last-child { border-bottom: 0; }
.list .what { min-width: 0; display: grid; }
.list .what b { font-weight: 600; overflow-wrap: anywhere; }
.list .what small { color: var(--muted); font-size: 12px; }
.list .amt { font-weight: 700; }
.list .amt.wasted { color: var(--bad); }
.del { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 4px 8px; font-size: 12px; color: var(--muted); }
.del.armed { color: var(--surface); background: var(--bad); border-color: var(--bad); }
.day-head { font-size: 12px; font-weight: 700; color: var(--muted); padding-top: 10px; text-transform: uppercase; letter-spacing: 0.06em; }

.plan-rows { display: grid; gap: 10px; }
.plan-row { display: grid; grid-template-columns: 1fr 7.5em; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; }
.plan-row .wide { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; }
.plan-row .wide select { flex: 1; }
.alloc { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; padding: 10px 12px; border-radius: 10px; background: var(--track); flex-wrap: wrap; }
.alloc.bad { background: var(--bad-bg); color: var(--bad); } .alloc.good { background: var(--good-bg); color: var(--good); } .alloc.warn { background: var(--warn-bg); color: var(--warn); }
.muted { color: var(--muted); font-size: 13px; margin: 0; }
.status { font-size: 12px; color: var(--muted); text-align: center; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tabbar div { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tabbar a { text-align: center; padding: 12px 4px 13px; font-weight: 700; font-size: 13px; color: var(--muted); text-decoration: none; border-top: 3px solid transparent; }
.tabbar a[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); }
.tabbar a.add-tab { color: var(--accent-2); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-weight: 600; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .bar i, .hero-meter i { transition: width .4s ease; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand">Lira<span>Ledger</span></div>
    <div class="month">
      <button class="icon-btn" id="prevMonth" aria-label="Previous month">‹</button>
      <b id="monthLabel">—</b>
      <button class="icon-btn" id="nextMonth" aria-label="Next month">›</button>
    </div>
  </header>

  <main id="view-today" class="view" style="display:grid;gap:14px"></main>
  <main id="view-add" class="view" style="display:grid;gap:14px" hidden></main>
  <main id="view-plan" class="view" style="display:grid;gap:14px" hidden></main>
  <p class="status" id="status"></p>
</div>

<nav class="tabbar" aria-label="Sections"><div>
  <a href="#today" data-tab="today">Today</a>
  <a href="#add" data-tab="add" class="add-tab">+ Spend</a>
  <a href="#plan" data-tab="plan">Plan</a>
</div></nav>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  "use strict";
  // ---------- helpers ----------
  const TRY = new Intl.NumberFormat("tr-TR", { style: "currency", currency: "TRY", maximumFractionDigits: 0 });
  const fmt = (n) => TRY.format(Math.round(n || 0));
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = (n) => String(n).padStart(2, "0");
  const keyOf = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1);
  const isoDate = (d) => keyOf(d) + "-" + pad(d.getDate());
  const sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const monthName = (key) => { const [y, m] = key.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString("en-GB", { month: "long", year: "numeric" }); };
  const shiftMonth = (key, d) => { const [y, m] = key.split("-").map(Number); return keyOf(new Date(y, m - 1 + d, 1)); };
  const TYPES = { fixed: "Fixed bill", need: "Need", want: "Want", saving: "Savings" };

  // Starter plan: 36,000 TRY a month. Every number is editable on the Plan tab.
  const STARTER = { income: 36000, categories: [
    { id: "rent", name: "Rent", type: "fixed", budget: 14000 },
    { id: "bills", name: "Bills (electric, gas, water, internet, phone)", type: "fixed", budget: 3000 },
    { id: "groceries", name: "Groceries", type: "need", budget: 7000 },
    { id: "transport", name: "Transport", type: "need", budget: 2000 },
    { id: "other", name: "Other needs & surprises", type: "need", budget: 2000 },
    { id: "eating-out", name: "Eating out & cafés", type: "want", budget: 2500 },
    { id: "personal", name: "Shopping & personal", type: "want", budget: 2000 },
    { id: "savings", name: "Savings", type: "saving", budget: 3500 }
  ] };

  // ---------- the math (pure) ----------
  function compute(plan, exps, key, now) {
    const [y, m] = key.split("-").map(Number);
    const dim = new Date(y, m, 0).getDate();
    const nowKey = keyOf(now);
    const isCurrent = key === nowKey, isPast = key < nowKey, isFuture = key > nowKey;
    const day = isCurrent ? now.getDate() : isPast ? dim : 0;
    const frac = day / dim;
    const today = isoDate(now);
    const ids = new Set(plan.categories.map((c) => c.id));
    const cats = plan.categories.map((c) => {
      const mine = exps.filter((e) => e.cat === c.id);
      const spent = sum(mine, (e) => e.amount);
      const left = c.budget - spent;
      const pct = c.budget > 0 ? spent / c.budget : (spent > 0 ? 9 : 0);
      let status, tone;
      if (c.type === "fixed") {
        if (spent > c.budget * 1.02) { status = "Over"; tone = "bad"; }
        else if (spent >= c.budget * 0.98 && spent > 0) { status = "Paid"; tone = "good"; }
        else if (spent > 0) { status = "Part paid"; tone = "neutral"; }
        else { status = "Due"; tone = "neutral"; }
      } else if (c.type === "saving") {
        if (spent >= c.budget) { status = "Saved"; tone = "good"; } else { status = "To save"; tone = "neutral"; }
      } else {
        if (spent > c.budget) { status = "Over"; tone = "bad"; }
        else if (!isFuture && pct > frac + 0.15 && pct > 0.25) { status = "Too fast"; tone = "warn"; }
        else { status = "On track"; tone = "good"; }
      }
      return Object.assign({}, c, { spent, left, pct, status, tone, count: mine.length });
    });
    const flex = cats.filter((c) => c.type === "need" || c.type === "want");
    const flexIds = new Set(flex.map((c) => c.id));
    const flexBudget = sum(flex, (c) => c.budget);
    const flexSpent = sum(flex, (c) => c.spent);
    const spentToday = isCurrent ? sum(exps.filter((e) => e.date === today && flexIds.has(e.cat)), (e) => e.amount) : 0;
    const daysLeft = isCurrent ? dim - day + 1 : isFuture ? dim : 0;
    const allowance = isCurrent ? Math.max(0, flexBudget - (flexSpent - spentToday)) / daysLeft : isFuture ? flexBudget / dim : 0;
    const todayLeft = allowance - spentToday;
    const tomorrow = isCurrent && daysLeft > 1 ? Math.max(0, flexBudget - flexSpent) / (daysLeft - 1) : 0;
    const totalSpent = sum(exps, (e) => e.amount);
    const allocated = sum(plan.categories, (c) => c.budget);
    const wasted = exps.filter((e) => e.wasted);
    const daily = [];
    for (let d = 1; d <= dim; d++) {
      const ds = key + "-" + pad(d);
      daily.push(sum(exps.filter((e) => e.date === ds && flexIds.has(e.cat)), (e) => e.amount));
    }
    const projected = day > 0 ? (flexSpent / day) * dim : 0;
    return {
      dim, day, frac, isCurrent, isPast, isFuture, cats, flexBudget, flexSpent, spentToday, daysLeft, allowance, todayLeft, tomorrow,
      totalSpent, income: plan.income, incomeLeft: plan.income - totalSpent, allocated, unallocated: plan.income - allocated,
      wasted, wastedTotal: sum(wasted, (e) => e.amount), wantSpent: sum(flex.filter((c) => c.type === "want"), (c) => c.spent),
      uncategorized: exps.filter((e) => !ids.has(e.cat)), daily, projected
    };
  }

  function insights(r) {
    const out = [];
    r.cats.filter((c) => c.status === "Over" && c.type !== "saving").forEach((c) =>
      out.push({ tone: "bad", text: `<b>${esc(c.name)}</b> is ${fmt(-c.left)} over budget. Cover it by cutting a Want category, not Savings.` }));
    if (r.isCurrent && r.todayLeft < 0) out.push({ tone: "bad", text: `You went ${fmt(-r.todayLeft)} over today's allowance. That lowers every remaining day to <b>${fmt(r.tomorrow)}</b>.` });
    r.cats.filter((c) => c.status === "Too fast").forEach((c) => {
      const perDay = r.daysLeft > 0 ? c.left / r.daysLeft : 0;
      out.push({ tone: "warn", text: `<b>${esc(c.name)}</b>: ${Math.round(c.pct * 100)}% used, but only ${Math.round(r.frac * 100)}% of the month has passed. Keep it under <b>${fmt(perDay)}/day</b> from now on.` });
    });
    if (r.wastedTotal > 0) {
      const top = r.wasted.slice().sort((a, b) => b.amount - a.amount)[0];
      out.push({ tone: "bad", text: `You marked <b>${fmt(r.wastedTotal)}</b> as wasted (${r.wasted.length} ${r.wasted.length === 1 ? "item" : "items"}). Biggest: ${esc(top.note || "no note")} for ${fmt(top.amount)}. That money could have gone to Savings.` });
    }
    if (r.flexSpent > 1000 && r.wantSpent / r.flexSpent > 0.4) out.push({ tone: "warn", text: `${Math.round((r.wantSpent / r.flexSpent) * 100)}% of your day-to-day spending is on Wants (eating out, shopping). Aim for under 30%.` });
    if (r.isCurrent && r.day >= 5 && r.flexBudget > 0) {
      const diff = r.projected - r.flexBudget;
      if (diff > r.flexBudget * 0.03) out.push({ tone: "warn", text: `At this pace you will spend <b>${fmt(r.projected)}</b> on day-to-day costs this month: ${fmt(diff)} more than planned.` });
      else out.push({ tone: "good", text: `At this pace you finish the month about <b>${fmt(-diff)}</b> under your day-to-day budget.` });
    }
    if (r.unallocated > 0) out.push({ tone: "warn", text: `${fmt(r.unallocated)} of your income has no job yet. Add it to Savings on the Plan tab.` });
    if (r.unallocated < 0) out.push({ tone: "bad", text: `Your plan hands out ${fmt(-r.unallocated)} more than you earn. Lower some budgets on the Plan tab.` });
    if (r.uncategorized.length) out.push({ tone: "warn", text: `${r.uncategorized.length} expense(s) belong to a category that is no longer in your plan (${fmt(sum(r.uncategorized, (e) => e.amount))}).` });
    const unpaid = r.cats.filter((c) => c.type === "fixed" && c.status !== "Paid" && c.status !== "Over");
    if (unpaid.length && !r.isFuture) out.push({ tone: "neutral", text: `Still to pay: ${unpaid.map((c) => `${esc(c.name)} (${fmt(c.left)})`).join(", ")}.` });
    if (!out.some((o) => o.tone === "bad" || o.tone === "warn")) out.unshift({ tone: "good", text: "Nothing is off track. Keep logging every spend." });
    return out;
  }
  window.__liraCompute = compute; window.__liraInsights = insights;

  // ---------- state + storage ----------
  const S = { month: keyOf(new Date()), view: "today", plans: {}, expenses: [], mode: "starting", plansLoaded: false, expLoaded: false, draft: null, readOnly: false, slow: false };
  const LS_KEY = "lira-ledger.v1";
  let local = { months: {}, expenses: [] };
  let db = null, unsubExp = null;
  function lsRead() { try { const v = JSON.parse(localStorage.getItem(LS_KEY)); if (v && v.months) return v; } catch (e) {} return { months: {}, expenses: [] }; }
  function lsWrite() { try { localStorage.setItem(LS_KEY, JSON.stringify(local)); return true; } catch (e) { return false; } }
  function refreshLocal() { S.plans = local.months; S.expenses = local.expenses.filter((e) => e.month === S.month); S.plansLoaded = S.expLoaded = true; }

  function subscribeExpenses() {
    if (unsubExp) unsubExp();
    S.expLoaded = false;
    unsubExp = db.collection("expenses").where("month", "==", S.month).onSnapshot((snap) => {
      S.expenses = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
      S.expLoaded = true; render();
    }, () => { S.expLoaded = true; S.slow = true; render(); });
  }

  async function start() {
    if (window.claude && typeof window.claude.use === "function") {
      render();
      let found = null;
      try { found = await window.claude.use("db"); } catch (e) { found = null; }
      if (found) {
        db = found; S.mode = "cloud";
        const timer = setTimeout(() => { if (!S.plansLoaded) { S.slow = true; render(); } }, 10000);
        db.collection("months").onSnapshot((snap) => {
          const p = {}; snap.docs.forEach((d) => { p[d.id] = d.data(); });
          S.plans = p; S.plansLoaded = true; S.slow = false; clearTimeout(timer); render();
        }, () => { S.plansLoaded = true; S.slow = true; clearTimeout(timer); render(); });
        subscribeExpenses();
        return;
      }
    }
    S.mode = "local"; local = lsRead(); refreshLocal(); render();
  }

  function writeFailed(e) {
    if (e && e.code === "invalid_argument") { S.readOnly = true; toast("You can view this budget but not change it."); }
    else toast("Couldn't save. Check your connection and try again.");
    render();
  }
  async function savePlan(key, plan) {
    const body = { income: plan.income, categories: plan.categories, updatedAt: new Date().toISOString() };
    if (S.mode === "cloud") { try { await db.doc("months/" + key).set(body); return true; } catch (e) { writeFailed(e); return false; } }
    local.months[key] = body; lsWrite(); refreshLocal(); return true;
  }
  async function addExpense(e) {
    if (S.mode === "cloud") { try { await db.collection("expenses").add(e); return true; } catch (err) { writeFailed(err); return false; } }
    local.expenses.push(Object.assign({ id: uid() }, e)); lsWrite(); refreshLocal(); return true;
  }
  async function deleteExpense(id) {
    if (S.mode === "cloud") { try { await db.doc("expenses/" + id).delete(); } catch (e) { writeFailed(e); } return; }
    local.expenses = local.expenses.filter((x) => x.id !== id); lsWrite(); refreshLocal(); render();
  }

  // ---------- UI ----------
  const $ = (id) => document.getElementById(id);
  let toastTimer;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600); }
  const plan = () => S.plans[S.month];
  const prevPlanKey = () => Object.keys(S.plans).filter((k) => k < S.month).sort().pop() || Object.keys(S.plans).sort().pop();

  function setupCard() {
    const pk = prevPlanKey();
    return `<section class="card"><h2>No budget for ${monthName(S.month)} yet</h2>
      <p class="muted">When your money arrives, set the month's plan: how much came in and where each lira goes.</p>
      <div class="btns">${pk ? `<button class="btn" data-act="copy-plan" data-from="${pk}">Copy ${monthName(pk)}'s plan</button>` : ""}
      <button class="btn ${pk ? "ghost" : ""}" data-act="starter">Start from the 36,000 ₺ template</button></div></section>`;
  }

  function renderToday() {
    const el = $("view-today");
    if (!S.plansLoaded) { el.innerHTML = `<section class="card"><h2>Loading your budget…</h2><p class="muted">${S.slow ? "Your saved budget can't be reached yet. It will appear when the connection returns." : "Fetching this month's plan and spending."}</p></section>`; return; }
    const p = plan();
    if (!p) { el.innerHTML = setupCard(); return; }
    const r = compute(p, S.expenses, S.month, new Date());
    let heroLabel, heroBig, heroSub, meter;
    if (r.isCurrent) {
      heroLabel = "Safe to spend today";
      heroBig = fmt(r.todayLeft);
      heroSub = `${fmt(r.spentToday)} spent of today's ${fmt(r.allowance)} · ${r.daysLeft} ${r.daysLeft === 1 ? "day" : "days"} left in ${monthName(S.month).split(" ")[0]}`;
      meter = r.allowance > 0 ? Math.min(1, r.spentToday / r.allowance) : 1;
    } else if (r.isPast) {
      heroLabel = r.incomeLeft >= 0 ? "Left over at month end" : "Overspent this month";
      heroBig = fmt(r.incomeLeft);
      heroSub = `${fmt(r.totalSpent)} spent of ${fmt(r.income)} income`;
      meter = r.income > 0 ? Math.min(1, r.totalSpent / r.income) : 1;
    } else {
      heroLabel = "Daily allowance when it starts";
      heroBig = fmt(r.allowance);
      heroSub = `${fmt(r.flexBudget)} for day-to-day spending over ${r.dim} days`;
      meter = 0;
    }
    const neg = r.isCurrent ? r.todayLeft < 0 : r.incomeLeft < 0;
    const order = { fixed: 0, need: 1, want: 2, saving: 3 };
    const cats = r.cats.slice().sort((a, b) => order[a.type] - order[b.type]);
    const catHtml = cats.map((c) => {
      const w = Math.min(100, Math.round(c.pct * 100));
      const showPace = (c.type === "need" || c.type === "want") && r.isCurrent;
      return `<div class="cat">
        <div class="cat-head"><span class="cat-name">${esc(c.name)}<span class="cat-type">${TYPES[c.type]}${c.oneOff ? " · this month only" : ""}</span></span>
          <span class="pill ${c.tone}">${c.status}</span></div>
        <div class="bar ${c.tone}"><i style="width:${w}%"></i>${showPace ? `<span class="pace" style="left:${Math.round(r.frac * 100)}%" title="Where you should be today"></span>` : ""}</div>
        <div class="cat-foot num"><span>${fmt(c.spent)} of ${fmt(c.budget)}</span><span class="cat-left" style="color:${c.left < 0 ? "var(--bad)" : "var(--ink)"}">${c.left < 0 ? fmt(-c.left) + " over" : fmt(c.left) + " left"}</span></div>
      </div>`;
    }).join("");
    el.innerHTML = `
      <section class="hero">
        <div class="eyebrow">${heroLabel}</div>
        <div class="big num ${neg ? "neg" : ""}">${heroBig}</div>
        <div class="hero-sub num">${heroSub}</div>
        <div class="hero-meter"><i style="width:${Math.round(meter * 100)}%"></i></div>
        <div class="stats num">
          <div><small>Income</small><strong>${fmt(r.income)}</strong></div>
          <div><small>Spent</small><strong>${fmt(r.totalSpent)}</strong></div>
          <div><small>Remaining</small><strong>${fmt(r.incomeLeft)}</strong></div>
        </div>
      </section>
      <section class="card"><h2>Where it's going wrong</h2>
        <ul class="insights">${insights(r).map((i) => `<li class="${i.tone}"><span>${i.text}</span></li>`).join("")}</ul></section>
      <section class="card"><h2>Budgets <em class="num">${fmt(r.incomeLeft)} left</em></h2><div class="cats">${catHtml}</div>
        ${r.isCurrent ? `<p class="muted">The thin line on each bar marks where you should be today.</p>` : ""}</section>
      ${chart(r)}`;
  }

  function chart(r) {
    if (r.isFuture) return "";
    const W = 320, H = 130, pl = 34, pb = 18, pt = 8;
    const avg = r.flexBudget / r.dim;
    const max = Math.max(avg * 1.6, ...r.daily, 1);
    const bw = (W - pl) / r.dim;
    const y = (v) => pt + (H - pt - pb) * (1 - v / max);
    const bars = r.daily.map((v, i) => {
      if (i >= r.day || v <= 0) return "";
      const x = pl + i * bw + 1, h = (H - pb) - y(v);
      return `<rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${Math.max(1, bw - 2).toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="${v > avg ? "var(--bad)" : "var(--accent)"}"><title>Day ${i + 1}: ${fmt(v)}</title></rect>`;
    }).join("");
    const ticks = [0, Math.round(max / 2), Math.round(max)].map((v) => `<text x="${pl - 4}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end" font-size="8" fill="var(--muted)">${v >= 1000 ? (v / 1000).toFixed(1).replace(".0", "") + "k" : v}</text><line x1="${pl}" x2="${W}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="0.5"/>`).join("");
    const days = [1, 10, 20, r.dim].map((d) => `<text x="${(pl + (d - 0.5) * bw).toFixed(1)}" y="${H - 4}" text-anchor="middle" font-size="8" fill="var(--muted)">${d}</text>`).join("");
    return `<section class="card chart"><h2>Day-to-day spending</h2>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily spending this month compared with the planned daily average">${ticks}${bars}
      <line x1="${pl}" x2="${W}" y1="${y(avg).toFixed(1)}" y2="${y(avg).toFixed(1)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 2"/>${days}</svg>
      <div class="legend"><span>Under plan</span><span class="l2">Over plan</span><span class="l3">Plan: ${fmt(avg)}/day</span></div></section>`;
  }

  let clearForm = false;
  function renderAdd() {
    const el = $("view-add");
    const keep = {};
    if (!clearForm) ["f-amount", "f-cat", "f-note", "f-date", "f-wasted"].forEach((id) => { const n = $(id); if (n) keep[id] = n.type === "checkbox" ? n.checked : n.value; });
    clearForm = false;
    const p = plan();
    if (!S.plansLoaded) { el.innerHTML = `<section class="card"><h2>Loading…</h2></section>`; return; }
    if (!p) { el.innerHTML = setupCard(); return; }
    const now = new Date();
    const defDate = S.month === keyOf(now) ? isoDate(now) : S.month + "-01";
    const groups = ["need", "want", "fixed", "saving"].map((t) => {
      const cs = p.categories.filter((c) => c.type === t);
      return cs.length ? `<optgroup label="${TYPES[t]}">${cs.map((c) => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")}</optgroup>` : "";
    }).join("");
    const exps = S.expenses.slice().sort((a, b) => (b.date + (b.at || "")).localeCompare(a.date + (a.at || "")));
    const names = Object.fromEntries(p.categories.map((c) => [c.id, c.name]));
    let lastDay = "", rows = "";
    exps.forEach((e) => {
      if (e.date !== lastDay) { lastDay = e.date; rows += `<li class="day-head" style="display:block">${new Date(e.date + "T12:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" })}</li>`; }
      rows += `<li><span class="what"><b>${esc(e.note || names[e.cat] || "Expense")}</b><small>${esc(names[e.cat] || "Removed category")}${e.wasted ? " · wasted" : ""}</small></span>
        <span class="amt num ${e.wasted ? "wasted" : ""}">${fmt(e.amount)}</span>
        ${S.readOnly ? "<span></span>" : `<button class="del" data-act="del" data-id="${esc(e.id)}" aria-label="Delete">✕</button>`}</li>`;
    });
    el.innerHTML = `
      <section class="card"><h2>Add a spend</h2>
        <form id="addForm">
          <label for="f-amount">Amount (₺)<input id="f-amount" class="amount-input num" type="number" inputmode="decimal" min="0" step="any" placeholder="0" required></label>
          <label for="f-cat">Category<select id="f-cat">${groups}</select></label>
          <label for="f-note">What was it?<input id="f-note" type="text" placeholder="e.g. Migros, bus card, coffee" maxlength="80"></label>
          <label for="f-date">Date<input id="f-date" type="date" value="${defDate}" min="${S.month}-01" max="${S.month}-${pad(compute(p, [], S.month, now).dim)}"></label>
          <label class="check" for="f-wasted"><input id="f-wasted" type="checkbox"> I didn't really need this (counts as wasted)</label>
          <button class="btn" type="submit" ${S.readOnly ? "disabled" : ""}>Add spend</button>
        </form></section>
      <section class="card"><h2>${monthName(S.month)} spending <em class="num">${fmt(sum(exps, (e) => e.amount))}</em></h2>
        ${exps.length ? `<ul class="list num">${rows}</ul>` : `<p class="muted">Nothing logged yet. Every spend you add shows up here and updates your daily allowance.</p>`}</section>`;
    Object.keys(keep).forEach((id) => { const n = $(id); if (!n) return; if (n.type === "checkbox") n.checked = keep[id]; else if (id !== "f-cat" || [...n.options].some((o) => o.value === keep[id])) n.value = keep[id]; });
  }

  function renderPlan() {
    const el = $("view-plan");
    if (!S.plansLoaded) { el.innerHTML = `<section class="card"><h2>Loading…</h2></section>`; return; }
    if (!S.draft) {
      const p = plan();
      if (!p) { el.innerHTML = setupCard(); return; }
      S.draft = JSON.parse(JSON.stringify({ income: p.income, categories: p.categories }));
    }
    const d = S.draft;
    const allocated = sum(d.categories, (c) => Number(c.budget) || 0);
    const diff = (Number(d.income) || 0) - allocated;
    const tone = diff === 0 ? "good" : diff > 0 ? "warn" : "bad";
    const rows = d.categories.map((c, i) => `
      <div class="plan-row">
        <input id="p-name-${i}" type="text" value="${esc(c.name)}" data-i="${i}" data-f="name" aria-label="Category name">
        <input id="p-budget-${i}" class="num" type="number" inputmode="decimal" min="0" value="${c.budget}" data-i="${i}" data-f="budget" aria-label="Budget for ${esc(c.name)}">
        <div class="wide"><select id="p-type-${i}" data-i="${i}" data-f="type" aria-label="Type">${Object.keys(TYPES).map((t) => `<option value="${t}" ${t === c.type ? "selected" : ""}>${TYPES[t]}</option>`).join("")}</select>
        <button class="del" type="button" data-act="rm-cat" data-i="${i}">Remove</button></div>
        <label class="check wide" for="p-once-${i}" style="font-size:13px"><input id="p-once-${i}" type="checkbox" data-i="${i}" data-f="oneOff" ${c.oneOff ? "checked" : ""}> This month only (left out when copying to next month)</label>
      </div>`).join("");
    el.innerHTML = `
      <section class="card"><h2>${monthName(S.month)} plan</h2>
        <div class="form">
          <label for="p-income">Money received this month (₺)<input id="p-income" class="amount-input num" type="number" inputmode="decimal" min="0" value="${d.income}" data-f="income"></label>
          <div class="alloc ${tone} num" id="allocBox"><span>Given a job: ${fmt(allocated)}</span><span>${diff === 0 ? "Every lira has a job" : diff > 0 ? fmt(diff) + " unassigned" : fmt(-diff) + " too much"}</span></div>
          <p class="muted"><b>Fixed bill</b>: rent, utilities, paid once. <b>Need</b> and <b>Want</b>: day-to-day spending; these make up your daily allowance. <b>Savings</b>: money you put aside.</p>
          <div class="plan-rows">${rows}</div>
          <div class="btns"><button class="btn ghost small" type="button" data-act="add-cat">+ Add category</button></div>
          <div class="btns"><button class="btn" type="button" data-act="save-plan" ${S.readOnly ? "disabled" : ""}>Save plan</button>
          <button class="btn ghost" type="button" data-act="reset-draft">Discard changes</button></div>
        </div></section>`;
  }

  function render() {
    $("monthLabel").textContent = monthName(S.month);
    ["today", "add", "plan"].forEach((v) => { $("view-" + v).hidden = S.view !== v; });
    document.querySelectorAll(".tabbar a").forEach((a) => a.setAttribute("aria-current", a.dataset.tab === S.view ? "page" : "false"));
    if (S.view === "today") renderToday();
    if (S.view === "add") renderAdd();
    if (S.view === "plan") renderPlan();
    $("status").textContent = S.mode === "cloud" ? (S.slow ? "Offline: showing what was last loaded." : "Synced to your Claude account. Claude can read and update this budget.")
      : S.mode === "local" ? "Saved on this device only." : "Connecting…";
  }

  function go(view) { S.view = view; render(); window.scrollTo(0, 0); }
  function route() { const h = location.hash.slice(1); go(["today", "add", "plan"].includes(h) ? h : "today"); }
  window.addEventListener("hashchange", route);

  function changeMonth(d) {
    S.month = shiftMonth(S.month, d); S.draft = null;
    if (S.mode === "cloud") subscribeExpenses(); else if (S.mode === "local") refreshLocal();
    render();
  }
  $("prevMonth").addEventListener("click", () => changeMonth(-1));
  $("nextMonth").addEventListener("click", () => changeMonth(1));

  document.addEventListener("click", async (ev) => {
    const b = ev.target.closest("[data-act]"); if (!b) return;
    const act = b.dataset.act;
    if (act === "copy-plan") { const src = S.plans[b.dataset.from]; S.draft = JSON.parse(JSON.stringify({ income: src.income, categories: src.categories.filter((c) => !c.oneOff) })); location.hash = "plan"; go("plan"); }
    if (act === "starter") { S.draft = JSON.parse(JSON.stringify(STARTER)); location.hash = "plan"; go("plan"); }
    if (act === "add-cat") { S.draft.categories.push({ id: "c-" + uid(), name: "New category", type: "need", budget: 0 }); renderPlan(); }
    if (act === "rm-cat") { S.draft.categories.splice(Number(b.dataset.i), 1); renderPlan(); }
    if (act === "reset-draft") { S.draft = null; renderPlan(); }
    if (act === "save-plan") {
      const d = S.draft;
      d.categories = d.categories.filter((c) => c.name.trim()).map((c) => Object.assign({ id: c.id, name: c.name.trim(), type: c.type, budget: Math.max(0, Number(c.budget) || 0) }, c.oneOff ? { oneOff: true } : {}));
      d.income = Math.max(0, Number(d.income) || 0);
      if (await savePlan(S.month, d)) { S.draft = null; toast("Plan saved for " + monthName(S.month)); location.hash = "today"; go("today"); }
    }
    if (act === "del") {
      if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Delete?"; setTimeout(() => { if (b.isConnected) { b.classList.remove("armed"); b.textContent = "✕"; } }, 3000); return; }
      await deleteExpense(b.dataset.id); toast("Deleted");
    }
  });

  document.addEventListener("input", (ev) => {
    const t = ev.target; if (!S.draft || !t.dataset.f || !t.closest("#view-plan")) return;
    if (t.dataset.f === "income") S.draft.income = t.value;
    else S.draft.categories[Number(t.dataset.i)][t.dataset.f] = t.type === "checkbox" ? t.checked : t.value;
    const allocated = sum(S.draft.categories, (c) => Number(c.budget) || 0);
    const diff = (Number(S.draft.income) || 0) - allocated;
    const box = $("allocBox");
    if (box) { box.className = "alloc num " + (diff === 0 ? "good" : diff > 0 ? "warn" : "bad"); box.innerHTML = `<span>Given a job: ${fmt(allocated)}</span><span>${diff === 0 ? "Every lira has a job" : diff > 0 ? fmt(diff) + " unassigned" : fmt(-diff) + " too much"}</span>`; }
  });

  document.addEventListener("submit", async (ev) => {
    if (ev.target.id !== "addForm") return;
    ev.preventDefault();
    const amount = Number(String($("f-amount").value).replace(",", "."));
    if (!(amount > 0)) { toast("Enter an amount above 0"); return; }
    const date = $("f-date").value || isoDate(new Date());
    const cat = $("f-cat").value;
    const e = { month: date.slice(0, 7), date, amount, cat, note: $("f-note").value.trim(), wasted: $("f-wasted").checked, at: new Date().toISOString() };
    if (await addExpense(e)) {
      const name = (plan().categories.find((c) => c.id === cat) || {}).name || "budget";
      toast(`Added ${fmt(amount)} to ${name}`);
      clearForm = true; render(); const f = $("f-amount"); if (f) f.focus();
    }
  });

  route();
  start();
})();
</script>
<script>if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(function(){})}</script>
</body></html>
